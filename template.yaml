abstract: |
  Masked diffusion language models decode by iteratively unmasking tokens. While the unmasking order defines an **"order of thought"** that strongly influences generation quality, it is typically chosen heuristically. We introduce **Self-Aware Scheduling (SAS)**, which learns a lightweight order policy using **Group Relative Policy Optimization (GRPO)**. 

sections:
  - title: "The Self-Aware Reward"
    content: |
      We derive a tractable upper bound on the sequential decoding mismatch using KL divergence:
      
      $$\mathcal{R}(\tau) = \sum_{t=1}^{L} \log p(x_{o_t} | x_{<t}, \text{mask})$$
      
      By maximizing this reward, the policy learns to select tokens that the model is most confident about in context.

  - title: "Performance Gains"
    content: |
      | Task | Model | Heuristic | **SAS (Ours)** |
      | :--- | :--- | :--- | :--- |
      | **Sudoku** | SMDM-1B | 82.0% | **91.8%** |
      | **GSM8K** | LLaDA-8B | 64.0% | **76.0%** |
      | **MBPP** | LLaDA-8B | 39.5% | **41.0%** |