abstract: |
  Masked diffusion language models decode by iteratively unmasking tokens. We introduce **Self-Aware Scheduling (SAS)**, which learns a lightweight order policy using **GRPO**. SAS improves both structured and
  open-ended reasoning across domains and scales---from Sudoku with a 1B model to math and code
  reasoning with LLaDA-8B---and remains robust across generation lengths and semi-autoregressive
  block decoding.
body:
  - title: "Overview"
    image: "intro_figure.png"
  - title: "The Self-Aware Reward"
    text: |
      We derive a tractable upper bound on the sequential decoding mismatch using KL divergence. This induces a dense reward over trajectories:
      
      $$ \mathcal{R}(\tau) = \sum_{t=1}^{N} \log p_\theta^{i_t}(x_{i_t} \mid \tilde{x}^{(t-1)}(\sigma))$$
      
      By maximizing this reward, the policy learns to select tokens that the model is most confident about in context.

  - title: "Key Performance Gains"
    text: |
      SAS consistently outperforms heuristic schedules across reasoning benchmarks.
      
      | Task | Model | Confidence Heuristic | **SAS (Ours)** |
      |:---|:---|:---|:---|
      | **Sudoku** | SMDM-1B | 82.0% | **91.8%** |
      | **GSM8K** | LLaDA-8B | 76.0% | **81.0%** |
      | **MBPP** | LLaDA-8B | 39.5% | **41.0%** |

