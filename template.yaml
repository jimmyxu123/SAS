abstract: |
  Masked diffusion language models decode by iteratively unmasking tokens, where the unmasking order defines an ``order of thought'' that strongly influences generation quality yet is typically chosen heuristically. We derive a tractable upper bound on the sequential decoding mismatch, measured by the Kullback–Leibler divergence and expressed in terms of the model's pathwise log-likelihood, with tightness under sufficient model expressivity. This bound induces a dense self-aware reward over ordered trajectories, casting order selection as a principled policy optimization problem with a frozen denoiser. We instantiate this idea as **Self-Aware Scheduling (SAS)**, which learns a lightweight order policy using Group Relative Policy Optimization and applies seamlessly to both any-order and semi-autoregressive decoding. SAS improves both structured and open-ended reasoning across domains and scales---from Sudoku with a 1B model to math and code reasoning with LLaDA-8B---and remains robust across generation lengths and semi-autoregressive block decoding.
body:
  - title: "Overview"
    image: "intro_figure.png"
    caption: |
      Figure 1: Overview of the Self-Aware Scheduling (SAS) framework.
      Left (Training): The order policy $v_\phi$ samples multiple unmasking permutations ($\sigma_1$, $\sigma_2$, ...) for a frozen diffusion model. These orders are evaluated using our Self-Aware Reward, which measures the cumulative log-likelihood of the generation under that specific order. The policy is then optimized via GRPO to favor orders that maximize the model's own confidence.
      Right (Inference): The trained policy dictates the optimal unmasking sequence, guiding the diffusion model to generate high-quality outputs efficiently.
  - title: "The Self-Aware Reward"
    text: |
      We derive a tractable upper bound on the sequential decoding mismatch using KL divergence. This induces a dense reward over trajectories:
      
      $$ \mathcal{R}(x, \sigma) = \sum_{t=1}^{N} \log p_\theta^{i_t}(x_{i_t} \mid \tilde{x}^{(t-1)}(\sigma))$$
      
      By maximizing this reward, the policy learns to select tokens that the model is most confident about in context.

  - title: "Demo of SAS on Sudoku"
    image: "sudoku_unmasking.gif"
    caption: "Visualization of the learned unmasking order. White cells represent fixed initial hints. Blue cells indicate generated tokens, where color intensity corresponds to the decoding step: lighter blue denotes early unmasking (high-confidence/foundational moves), while darker blue denotes later unmasking."
  - title: "Key Performance Gains"
    text: |
      SAS consistently outperforms heuristic schedules across reasoning benchmarks.
      
      | Task | Model | Confidence Heuristic | **SAS (Ours)** |
      |:---|:---|:---|:---|
      | **Sudoku** | SMDM-1B | 82.0% | **91.8%** |
      | **GSM8K** | LLaDA-8B | 76.0% | **81.0%** |
      | **MBPP** | LLaDA-8B | 39.5% | **41.0%** |

